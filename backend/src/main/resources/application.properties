spring.application.name=backend

# Database (override in application-local.properties or with environment variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tixora}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:change-me}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.port=8080

# JWT
app.jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-string-before-deploying}
app.jwt.expiration-ms=86400000

# CORS (React Vite dev server)
app.cors.allowed-origins=http://localhost:5173

# Default admin account (created on first run)
app.admin.name=Tixora Admin
app.admin.email=admin@tixora.com
app.admin.password=${ADMIN_PASSWORD:Admin@12345}

# File uploads (event images)
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Local overrides (this file is NOT committed to git)
spring.config.import=optional:classpath:application-local.properties