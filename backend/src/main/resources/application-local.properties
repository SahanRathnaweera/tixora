spring.application.name=backend


# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/tixora
spring.datasource.username=postgres
spring.datasource.password=123456

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.port=8080
# JWT
app.jwt.secret=tixora-change-this-secret-to-a-long-random-string-123456
app.jwt.expiration-ms=86400000

# CORS (React Vite dev server)
app.cors.allowed-origins=http://localhost:5173

# Default admin account (created on first run)
app.admin.name=Tixora Admin
app.admin.email=admin@tixora.com
app.admin.password=Admin@12345

# File uploads (event images)
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB